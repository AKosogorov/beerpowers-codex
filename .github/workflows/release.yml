name: release

on:
  push:
    branches: [main]
    paths: ['plugins/beerpowers/.codex-plugin/plugin.json']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Выпустить версию манифеста Codex
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugins/beerpowers/.codex-plugin/plugin.json').version")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "GitHub Release $tag уже существует."
            exit 0
          fi
          ref="refs/tags/$tag"
          refs=$(git ls-remote --tags origin "$ref" "$ref^{}")
          target=$(awk -v ref="$ref" '$2 == ref { sha = $1 } $2 == ref "^{}" { peeled = $1 } END { print (peeled ? peeled : sha) }' <<< "$refs")
          if [[ -n "$target" && "$target" != "$GITHUB_SHA" ]]; then
            echo "Тег $tag уже указывает на другой коммит." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/beerpowers-release-notes.md"
          node .github/scripts/release_notes.mjs "$version" > "$notes"
          gh release create "$tag" --target "$GITHUB_SHA" --title "beerpowers-codex $version" --notes-file "$notes"
